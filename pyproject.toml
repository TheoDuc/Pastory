[project]
name = "pastory"
version = "0.1.0"
description = "Pastory — tableau de bord local des actifs d'un portefeuille Trade Republic"
readme = "README.md"
requires-python = ">=3.12"

# Dépendances du cœur de l'application. Elles sont ajoutées étape par étape,
# jamais « au cas où » : chacune doit servir à du code existant.
dependencies = [
    "dash>=3.0",      # interface locale (D-31, étapes 8 et 9)
    "tzdata>=2024.1", # les fuseaux horaires, que Windows ne fournit pas (D-116)
    "numpy>=2.0",     # les 10 000 tirages de la prédiction de l'évolution (D-105)
]

[project.scripts]
# Point d'entrée unique : `uv run pastory <commande>`
pastory = "pastory.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pastory"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Jeu de règles choisi explicitement : les règles par défaut changent d'une version de
# ruff à l'autre, et le projet doit rester reproductible.
select = [
    "E", # style
    "F", # erreurs réelles (variable inutilisée, import manquant…)
    "I", # ordre des imports
    "UP", # tournures obsolètes de Python
    "B", # pièges classiques
    "SIM", # simplifications lisibles
]
# Volontairement absent : FURB157, qui voudrait écrire `Decimal(2)` au lieu de
# `Decimal("2")`. Tous les montants et quantités sont écrits sous forme de texte, sans
# exception, parce que c'est la seule forme correcte pour un nombre à virgule (D-33).

