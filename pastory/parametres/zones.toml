# Les pays et leur regroupement en zones (D-66, D-67, D-58).
#
# Deux choses différentes vivent ici, et il faut les distinguer :
#
# 1. le **nom français d'un pays**, à partir de son code ISO 3166-1 alpha-2. C'est une norme :
#    stable, gratuite, vérifiable. C'est la clé de tout le calcul géographique, et jamais un
#    libellé venu d'une source (D-66) ;
# 2. sa **zone**, qui n'est PAS une donnée mais une **convention** (D-67). Il n'existe aucune norme
#    pour « développé » et « émergent » : seuls des fournisseurs d'indices en publient, et ils ne
#    sont pas d'accord entre eux. D'où la date et le fournisseur ci-dessous, et la liberté de
#    corriger ce fichier sans toucher au code.
#
# LES DÉSACCORDS ACTIFS, à connaître avant de s'étonner d'un chiffre :
#   - la CORÉE DU SUD est émergente chez MSCI, développée chez FTSE. Elle est ici en émergents ;
#   - la POLOGNE, de même ;
#   - la GRÈCE est développée chez FTSE depuis le 21/09/2026, et ne le sera chez MSCI qu'en
#     mai 2027. Elle est ici en émergents ;
#   - la BULGARIE a adopté l'euro le 01/01/2026, ce qui ne change pas sa zone mais change les
#     agrégats « zone euro » publiés ailleurs.
#
# CONVENTION DE LECTURE, la même que chez MSCI et chez tous les outils du marché :
# « Europe » désigne l'**Europe développée**. L'Europe émergente (Pologne, Grèce, Hongrie,
# Tchéquie, Turquie…) est comptée dans « marchés émergents », pas dans « Europe ». Et le Mexique
# n'est jamais en Amérique du Nord, malgré la géographie.
#
# Un code pays absent de ce fichier n'est pas une erreur et n'est jamais deviné : il est affiché
# tel quel, avec sa zone inconnue, et signalé (règle 5 de CLAUDE.md).

[meta]
source = "Codes et noms de pays : ISO 3166-1 alpha-2, https://www.iso.org/iso-3166-country-codes.html. Regroupement en zones : MSCI Market Classification, https://www.msci.com/our-solutions/indexes/market-classification"
fournisseur_des_zones = "MSCI Market Classification"
verifie_le = 2026-09-27
note = "Les zones sont une convention de fournisseur, pas une norme. Corriger ce fichier ne demande aucune ligne de code."

# --- Les zones -------------------------------------------------------------------------

[zone.amerique_du_nord]
libelle = "Amérique du Nord"
rang = 1

[zone.europe]
libelle = "Europe développée"
rang = 2

[zone.japon]
libelle = "Japon"
rang = 3

[zone.asie_pacifique_developpee]
libelle = "Asie-Pacifique développée"
rang = 4

[zone.marches_emergents]
libelle = "Marchés émergents"
rang = 5

[zone.autres]
libelle = "Autres pays et territoires"
rang = 6
note = "Israël, marché développé qui n'entre dans aucune des zones ci-dessus, et les territoires qui servent surtout de domiciliation juridique (Bermudes, îles Caïmans…)."

